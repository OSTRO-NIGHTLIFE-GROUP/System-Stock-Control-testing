          try {
            const wb = XLSX.read(ev.target.result, { type: "binary" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const matrix = XLSX.utils
              .sheet_to_json(ws, { header: 1, defval: "" })
              .filter((r) => r.length > 0);
            const headerIdx = detectHeader(matrix[0], {
              name: /supplier|name/,
              types: /product|type/,
              address: /address/,
              contact: /contact/,
              phone: /phone|tel/,
            });
            const dataRows =
              headerIdx.name !== undefined ? matrix.slice(1) : matrix;
            let added = 0,
              updated = 0;
            dataRows.forEach((r) => {
              const name = String(
                r[headerIdx.name !== undefined ? headerIdx.name : 0] || "",
              ).trim();
              if (!name) return;
              const data = {
                productTypes: String(r[headerIdx.types] || "").trim(),
                address: String(r[headerIdx.address] || "").trim(),
                contact: String(r[headerIdx.contact] || "").trim(),
                phone: String(r[headerIdx.phone] || "").trim(),
              };
              let s = state.suppliers.find(
                (x) => x.name.toLowerCase() === name.toLowerCase(),
              );
              if (s) {
                Object.assign(s, data);
                updated++;
              } else {
                state.suppliers.push({ id: uid("sup"), name, ...data });
                added++;
              }
            });
            await storeSet("os_suppliers", state.suppliers);
            toast(
              `Imported ${added} new, updated ${updated} existing supplier(s).`,
            );
            renderApp();
          } catch (err) {
            toast("Could not read file — check it's a valid Excel/CSV.", true);
          }
        };
        reader.readAsBinaryString(file);
      }
      function renderSettingsTemplates() {
        const t = state.templates;
        return `<div class="panel"><div class="panel-head"><h3>Purchase Order Form</h3></div>
    <p class="hint" style="margin-top:0;">Footer note shown on the exported Purchase Order supplier document.</p>
    <div class="field"><label>Footer note</label><input id="tplPoFooter" value="${esc(t.poFooterNote || "")}"></div>
    <button class="btn btn-primary btn-sm" style="width:auto;" onclick="saveTemplates()">Save all</button>
  </div>
  <div class="panel"><div class="panel-head"><h3>Stock Transfer Report</h3></div>
    <div class="field"><label>Footer note</label><input id="tplTransferFooter" value="${esc(t.transferFooterNote || "")}"></div>
    <button class="btn btn-primary btn-sm" style="width:auto;" onclick="saveTemplates()">Save all</button>
  </div>
  <div class="panel"><div class="panel-head"><h3>Stock Expense Report</h3></div>
    <div class="field"><label>Footer note</label><input id="tplExpenseFooter" value="${esc(t.expenseFooterNote || "")}"></div>
    <button class="btn btn-primary btn-sm" style="width:auto;" onclick="saveTemplates()">Save all</button>
  </div>
  <div class="panel"><div class="panel-head"><h3>Expiry Alerts Report</h3></div>
    <div class="field"><label>Footer note</label><input id="tplExpiryFooter" value="${esc(t.expiryFooterNote || "")}"></div>
    <button class="btn btn-primary btn-sm" style="width:auto;" onclick="saveTemplates()">Save all</button>
  </div>`;
      }
      async function saveTemplates() {
        state.templates.poFooterNote = document
          .getElementById("tplPoFooter")
          .value.trim();
        state.templates.transferFooterNote = document
          .getElementById("tplTransferFooter")
          .value.trim();
        state.templates.expenseFooterNote = document
          .getElementById("tplExpenseFooter")
          .value.trim();
        state.templates.expiryFooterNote = document
          .getElementById("tplExpiryFooter")
          .value.trim();
        await storeSet("os_templates", state.templates);
        toast("Templates saved.");
      }
      function renderSettingsBarcode() {
        const items = (state.stock[state.outlet] || [])
          .slice()
          .sort((a, b) => (a.barcode ? 0 : 1) - (b.barcode ? 0 : 1));
        let html = `<div class="panel"><div class="panel-head"><h3>Import barcodes from Excel — ${esc(state.outlet)}</h3>
    <button class="btn btn-ghost btn-sm" onclick="downloadBarcodeSample()">Download sample file</button></div>
    <div class="file-drop">Columns: <code>SKU</code>, <code>Barcode</code>, <code>Description</code> (matches by SKU)<br>
      <input type="file" id="bcImportFile" accept=".xlsx,.xls,.csv" onchange="handleBarcodeImport(event)"></div>
  </div>
  <div class="panel"><div class="panel-head"><h3>Registered items — ${esc(state.outlet)} (${items.length})</h3></div>
  <p class="hint" style="margin-top:0;">Edit SKU's Name, Barcode, or Description directly. Scan or type a code to register.</p>`;
        if (items.length === 0) {
          html += `<div class="empty-state"><p>No items in this outlet yet.</p></div>`;
        } else {
          html += `<table><thead><tr><th>SKU</th><th>Name</th><th>Barcode</th><th>Description</th><th></th></tr></thead><tbody>`;
          items.slice(0, 300).forEach((it) => {
            html += `<tr><td class="mono">${esc(it.sku)}</td>
        <td><input class="search-input" style="min-width:130px;" value="${esc(it.name)}" onchange="editBarcodeField('${it.id}','name',this.value)"></td>
        <td><input class="search-input" id="bc_${it.id}" style="min-width:130px;" value="${esc(it.barcode || "")}" placeholder="Scan or type" onchange="editBarcodeField('${it.id}','barcode',this.value)"></td>
        <td><input class="search-input" style="min-width:140px;" value="${esc(it.description || "")}" onchange="editBarcodeField('${it.id}','description',this.value)"></td>
        <td class="right"><button class="btn btn-ghost btn-sm" onclick="openScanModal('bc_${it.id}')">Scan</button></td></tr>`;
          });
          html += `</tbody></table>`;
          if (items.length > 300)
            html += `<p class="hint">Showing first 300 of ${items.length} items — use search-heavy views (Stock Ledger) for the rest.</p>`;
        }
        html += `</div>`;
        return html;
      }
      function downloadBarcodeSample() {
        try {
          const aoa = [
            ["SKU", "Barcode", "Description"],
            ["B1801-BL", "8850001234567", "Aperol aperitif bottle"],
          ];
          const ws = XLSX.utils.aoa_to_sheet(aoa);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Sample");
          XLSX.writeFile(wb, "sample_barcode_import.xlsx");
        } catch (e) {
          toast("Could not generate sample file.", true);
        }
      }
      function handleBarcodeImport(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function (ev) {
          try {
            const wb = XLSX.read(ev.target.result, { type: "binary" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const matrix = XLSX.utils
              .sheet_to_json(ws, { header: 1, defval: "" })
              .filter((r) => r.length > 0);
            const headerIdx = detectHeader(matrix[0], {
              sku: /sku/,
              barcode: /barcode|code/,
              desc: /desc/,
            });
            const dataRows =
              headerIdx.sku !== undefined ? matrix.slice(1) : matrix;
            const items = state.stock[state.outlet];
            let updated = 0,
              missed = 0;
            dataRows.forEach((r) => {
              const sku = String(
                r[headerIdx.sku !== undefined ? headerIdx.sku : 0] || "",
              ).trim();
              if (!sku) return;
              const it = items.find(
                (x) => x.sku.toLowerCase() === sku.toLowerCase(),
              );
              if (!it) {
                missed++;
                return;
              }
              if (headerIdx.barcode !== undefined)
                it.barcode = String(r[headerIdx.barcode] || "").trim();
              if (headerIdx.desc !== undefined)
                it.description = String(r[headerIdx.desc] || "").trim();
              updated++;
            });
            await saveStock(state.outlet);
            toast(
              `Updated ${updated} item(s)${missed ? `, ${missed} SKU(s) not found` : ""}.`,
            );
            renderApp();
          } catch (err) {
            toast("Could not read file — check it's a valid Excel/CSV.", true);
          }
        };
        reader.readAsBinaryString(file);
      }
      async function editBarcodeField(itemId, field, val) {
        const it = state.stock[state.outlet].find((x) => x.id === itemId);
        if (!it) return;
        it[field] = val;
        await saveStock(state.outlet);
        toast("Saved.");
      }

      /* ---------------- ACCOUNT POPOVER ---------------- */
      function toggleAccountPopover() {
        const existing = document.getElementById("acctPopover");
        if (existing) {
          closeAccountPopover();
          return;
        }
        showAcctPopover();
      }
      function showAcctPopover() {
        closeAccountPopover();
        const u = state.user;
        const pop = document.createElement("div");
        pop.id = "acctPopover";
        pop.style.cssText =
          "position:fixed;top:64px;right:24px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;width:240px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);";
        pop.innerHTML = `
    <div style="font-weight:700;font-size:14px;">${esc(u.name)}</div>
    <div style="font-size:12px;color:var(--muted);">${esc(u.username)}${u.role === "admin" ? " &middot; Head Office Admin" : " &middot; " + esc(u.outlet) + " Staff"}</div>
    <div class="acct-row" onclick="cycleTheme(event)"><span>Theme</span><span style="color:var(--amber);">${THEME_LABELS[u.theme || "dark"]}</span></div>
    <div class="acct-row" onclick="closeAccountPopover();openAccountModal();">Edit profile</div>
    <div class="acct-row" style="color:var(--red);" onclick="doLogout();closeAccountPopover();">Sign out</div>
  `;
        document.body.appendChild(pop);
        setTimeout(
          () => document.addEventListener("click", outsideAcctClick),
          0,
        );
      }
      function outsideAcctClick(e) {
        const pop = document.getElementById("acctPopover");
        if (
          pop &&
          !pop.contains(e.target) &&
          !(e.target.closest && e.target.closest("#userBadge"))
        ) {
          closeAccountPopover();
        }
      }
      function closeAccountPopover() {
        const pop = document.getElementById("acctPopover");
        if (pop) pop.remove();
        document.removeEventListener("click", outsideAcctClick);
      }
      async function cycleTheme(event) {
        if (event) event.stopPropagation();
        const keys = Object.keys(THEMES);
        const idx = keys.indexOf(state.user.theme || "dark");
        const next = keys[(idx + 1) % keys.length];
        state.user.theme = next;
        applyTheme(next);
        const rec = state.users.find((x) => x.id === state.user.id);
        rec.theme = next;
        await storeSet("os_users", state.users);
        showAcctPopover();
      }

      /* ---------------- ACCOUNT PROFILE ---------------- */
      function openAccountModal() {
        const u = state.user;
        const roleName =
          u.role === "admin"
            ? "Head Office Admin"
            : roleOf(u)
              ? roleOf(u).name
              : "Full Access";
        showModal(
          `<h3>Account</h3>
    <div class="cards-row" style="margin-bottom:16px;">
      <div class="stat-card"><div class="label">ACCOUNT TYPE</div><div class="value" style="font-size:15px;">${esc(u.role === "admin" ? "Admin" : "Staff")}</div></div>
      <div class="stat-card"><div class="label">ROLE</div><div class="value" style="font-size:15px;">${esc(roleName)}</div></div>
      <div class="stat-card"><div class="label">OUTLET</div><div class="value" style="font-size:15px;">${u.outlet === "ALL" ? "All Outlets" : esc(u.outlet || "—")}</div></div>
    </div>
    <div class="field"><label>Full name</label><input id="accName" value="${esc(u.name)}"></div>
    <div class="field"><label>Username</label><input value="${esc(u.username)}" disabled></div>
    <div class="field"><label>Email</label><input id="accEmail" value="${esc(u.email || "")}" placeholder="optional"></div>
    <div class="field"><label>New password (leave blank to keep current)</label><input id="accPass" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;"></div>
    <div class="field"><label>Background theme</label>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
        ${Object.keys(THEMES)
          .map(
            (t) =>
              `<div><div class="theme-swatch ${u.theme === t ? "active" : ""}" style="background:${THEMES[t]["--bg"]};color:${THEMES[t]["--text"]};" onclick="previewTheme('${t}')">${THEME_LABELS[t]}</div></div>`,
          )
          .join("")}
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" style="width:auto;" onclick="saveAccount()">Save changes</button>
    </div>`,
          true,
        );
      }
      function previewTheme(name) {
        applyTheme(name);
        state.user.theme = name;
        openAccountModal();
      }
      async function saveAccount() {
        const u = state.user;
        u.name = document.getElementById("accName").value.trim() || u.name;
        u.email = document.getElementById("accEmail").value.trim();
        const pass = document.getElementById("accPass").value;
        if (pass) u.password = pass;
        const rec = state.users.find((x) => x.id === u.id);
        Object.assign(rec, {
          name: u.name,
          email: u.email,
          password: u.password,
          theme: u.theme,
        });
        await storeSet("os_users", state.users);
        closeModal();
        toast("Account updated.");
        renderApp();
      }

      /* ---------------- modal ---------------- */
      function showModal(innerHtml, wide) {
        const root = document.getElementById("modalRoot");
        root.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal${wide ? " wide" : ""}">${innerHtml}</div></div>`;
      }
      function closeModal() {
        if (scanState.interval || scanState.stream) stopScanQuiet();
        document.getElementById("modalRoot").innerHTML = "";
      }
      function stopScanQuiet() {
        if (scanState.interval) clearInterval(scanState.interval);
        if (scanState.stream)
          scanState.stream.getTracks().forEach((t) => t.stop());
        scanState.stream = null;
        scanState.interval = null;
      }

      /* ---------------- init ---------------- */
      loadAll();
      document.getElementById("loginPass").addEventListener("keydown", (e) => {
        if (e.key === "Enter") doLogin();
      });
    </script>
  </body>
</html>
