<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ostro Nightlife — Stock Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
      :root {
        --bg: #15161a;
        --panel: #1d1f24;
        --panel-2: #24262c;
        --line: #31333b;
        --text: #edebe4;
        --muted: #9a9ca6;
        --amber: #e5a54b;
        --amber-dim: #3a2e1c;
        --teal: #3fb6a6;
        --teal-dim: #173330;
        --red: #e1594f;
        --red-dim: #3a1e1c;
        --blue: #5b9bd5;
        --blue-dim: #1b2a38;
        --orange2: #ff8a3d;
        --radius: 6px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      .display {
        font-family: Arial, Helvetica, sans-serif;
      }
      code,
      .mono,
      .num {
        font-family: Arial, Helvetica, sans-serif;
      }
      button {
        font-family: Arial, Helvetica, sans-serif;
        cursor: pointer;
      }
      input,
      select,
      textarea {
        font-family: Arial, Helvetica, sans-serif;
      }
      ::selection {
        background: var(--amber-dim);
      }
      a {
        color: var(--amber);
      }

      #loginScreen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at 30% 20%,
          color-mix(in srgb, var(--panel) 85%, white 5%) 0%,
          var(--bg) 60%
        );
        padding: 24px;
      }
      .login-card {
        width: 100%;
        max-width: 380px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 36px 32px;
      }
      .login-brand {
        margin-bottom: 28px;
      }
      .login-brand .kicker {
        color: var(--amber);
        font-size: 12px;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
      }
      .login-brand h1 {
        font-size: 26px;
        font-weight: 700;
        margin: 0;
        line-height: 1.15;
      }
      .login-brand .sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .field input,
      .field select {
        width: 100%;
        padding: 10px 12px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        color: var(--text);
        font-size: 14px;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        outline: none;
        border-color: var(--amber);
      }
      .btn {
        border: none;
        border-radius: var(--radius);
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 700;
        transition: filter 0.12s ease;
      }
      .btn:hover {
        filter: brightness(1.12);
      }
      .btn-primary {
        background: var(--amber);
        color: #1b1503;
        width: 100%;
        padding: 11px;
      }
      .btn-ghost {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text);
      }
      .btn-teal {
        background: var(--teal);
        color: #06231e;
      }
      .btn-red {
        background: var(--red);
        color: #2b0908;
      }
      .btn-blue {
        background: var(--blue);
        color: #0b1d2b;
      }
      .btn-sm {
        padding: 5px 10px;
        font-size: 12px;
      }
      .login-error {
        background: var(--red-dim);
        color: #ffc9c4;
        border: 1px solid #5a2c28;
        border-radius: var(--radius);
        padding: 8px 10px;
        font-size: 12px;
        margin-bottom: 14px;
      }
      .demo-accounts {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .demo-accounts .kicker {
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 8px;
      }
      .demo-row {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        padding: 4px 0;
        color: var(--muted);
      }
      .demo-row code {
        color: var(--text);
      }

      #app {
        display: none;
        min-height: 100vh;
      }
      .shell {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 230px;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 20px 0;
        flex-shrink: 0;
        overflow-y: auto;
      }
      .sidebar .brand {
        padding: 0 20px 20px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 8px;
      }
      .sidebar .brand .kicker {
        color: var(--amber);
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      .sidebar .brand h2 {
        font-size: 17px;
        margin: 2px 0 0;
        font-weight: 700;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 20px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        border-left: 3px solid transparent;
        cursor: pointer;
        justify-content: space-between;
      }
      .nav-item .nl {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .nav-item:hover {
        color: var(--text);
        background: var(--panel-2);
      }
      .nav-item.active {
        color: var(--amber);
        border-left-color: var(--amber);
        background: var(--panel-2);
      }
      .nav-sep {
        padding: 14px 20px 6px;
        font-size: 10px;
        letter-spacing: 0.06em;
        color: #5c5e68;
      }
      .nav-badge {
        background: var(--red);
        color: #fff;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 700;
        padding: 1px 6px;
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .topbar {
        height: 60px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: var(--panel);
        flex-shrink: 0;
        gap: 16px;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .outlet-select select {
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 7px 10px;
        border-radius: var(--radius);
        font-size: 13px;
      }
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .user-badge {
        font-size: 12px;
        color: var(--muted);
        text-align: right;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
      }
      .user-badge:hover {
        background: var(--panel-2);
      }
      .user-badge b {
        color: var(--text);
        display: block;
        font-size: 13px;
      }
      .content {
        flex: 1;
        overflow: auto;
        padding: 26px 28px;
      }

      .page-title {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 4px;
      }
      .page-sub {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 20px;
      }

      .cards-row {
        display: flex;
        gap: 14px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }
      .stat-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px 18px;
        min-width: 150px;
        flex: 1;
      }
      .stat-card .label {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.03em;
        margin-bottom: 6px;
      }
      .stat-card .value {
        font-size: 24px;
        font-weight: 700;
      }
      .stat-card .value.amber {
        color: var(--amber);
      }
      .stat-card .value.red {
        color: var(--red);
      }
      .stat-card .value.teal {
        color: var(--teal);
      }
      .stat-card .value.orange2 {
        color: var(--orange2);
      }
      .stat-card .value.blue {
        color: var(--blue);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
      }
      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        gap: 12px;
        flex-wrap: wrap;
      }
      .panel-head h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .search-input {
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 7px 10px;
        border-radius: var(--radius);
        font-size: 13px;
        min-width: 170px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        text-align: left;
        color: var(--muted);
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.02em;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      td {
        padding: 8px 10px;
        border-bottom: 1px solid #26282e;
        vertical-align: middle;
      }
      tr:hover td {
        background: var(--panel-2);
      }
      .right {
        text-align: right;
      }
      .center {
        text-align: center;
      }
      .tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }
      .tag-teal {
        background: var(--teal-dim);
        color: var(--teal);
      }
      .tag-red {
        background: var(--red-dim);
        color: #ff8c83;
      }
      .tag-amber {
        background: var(--amber-dim);
        color: var(--amber);
      }
      .tag-orange2 {
        background: #3a2416;
        color: var(--orange2);
      }
      .tag-blue {
        background: var(--blue-dim);
        color: var(--blue);
      }
      .tag-muted {
        background: #2a2c33;
        color: var(--muted);
      }
      .mini-input {
        width: 64px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 4px 6px;
        border-radius: 4px;
        font-size: 12px;
        text-align: right;
      }
      .mini-input:focus {
        outline: none;
        border-color: var(--amber);
      }
      .icon-btn {
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 4px;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        line-height: 1;
        margin-left: 4px;
      }
      .icon-btn:hover {
        border-color: var(--amber);
        color: var(--amber);
      }
      .item-link {
        background: none;
        border: none;
        color: var(--text);
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
        padding: 0;
        font-size: 13px;
        text-align: left;
        font-family: inherit;
      }
      .item-link:hover {
        color: var(--amber);
      }
      .empty-state {
        text-align: center;
        padding: 50px 20px;
        color: var(--muted);
      }
      .empty-state .display {
        font-size: 18px;
        color: var(--text);
        margin-bottom: 6px;
      }

      textarea.paste-area {
        width: 100%;
        min-height: 130px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: var(--radius);
        padding: 12px;
        font-family: Arial, monospace;
        font-size: 12.5px;
        resize: vertical;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
        line-height: 1.5;
      }
      .hint code {
        background: var(--panel-2);
        padding: 1px 5px;
        border-radius: 3px;
      }
      .file-drop {
        border: 1.5px dashed var(--line);
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .file-drop input[type="file"] {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 12, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 20px;
        overflow: auto;
      }
      .modal {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px;
        width: 100%;
        max-width: 460px;
        max-height: 88vh;
        overflow: auto;
      }
      .modal.wide {
        max-width: 760px;
      }
      .modal h3 {
        margin: 0 0 16px;
        font-size: 16px;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
        flex-wrap: wrap;
      }

      .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-left: 3px solid var(--teal);
        color: var(--text);
        padding: 12px 16px;
        border-radius: 6px;
        font-size: 13px;
        z-index: 100;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        max-width: 320px;
      }
      .toast.error {
        border-left-color: var(--red);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #33353d;
        border-radius: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      .line-form {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .station-tag-Bar {
        background: var(--blue-dim);
        color: var(--blue);
      }
      .station-tag-Kitchen {
        background: var(--amber-dim);
        color: var(--amber);
      }
      .pill-tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .pill-tab {
        padding: 7px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--muted);
        cursor: pointer;
      }
      .pill-tab.active {
        background: var(--amber-dim);
        color: var(--amber);
        border-color: var(--amber);
      }
      .theme-swatch {
        width: 100%;
        height: 44px;
        border-radius: 6px;
        border: 2px solid var(--line);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      }
      .theme-swatch.active {
        border-color: var(--amber);
      }
      .settings-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        display: flex;
        gap: 14px;
        align-items: flex-start;
        cursor: pointer;
        transition: border-color 0.12s ease;
      }
      .settings-card:hover {
        border-color: var(--amber);
      }
      .settings-card-icon {
        width: 38px;
        height: 38px;
        border-radius: 8px;
        background: var(--panel-2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
      }
      .settings-card-chev {
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
        flex-shrink: 0;
      }
      .settings-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 14px;
      }
      .settings-section-head {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 22px 0 10px;
      }
      .settings-section-head .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
      }
      .settings-section-head .lbl {
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--muted);
        font-weight: 700;
      }
      .acct-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 9px 0;
        border-top: 1px solid var(--line);
        cursor: pointer;
        font-size: 13px;
      }
      .acct-row:hover {
        color: var(--amber);
      }

      #printArea {
        display: none;
      }
      @media print {
        body > *:not(#printArea) {
          display: none !important;
        }
        #printArea {
          display: block !important;
          padding: 20px;
          color: #000;
          background: #fff;
          font-family: Arial, sans-serif;
        }
        #printArea table {
          width: 100%;
          border-collapse: collapse;
        }
        #printArea th,
        #printArea td {
          border: 1px solid #999;
          padding: 6px 8px;
          font-size: 11px;
          color: #000;
        }
      }
      @media (max-width: 820px) {
        .sidebar {
          width: 64px;
        }
        .sidebar .brand h2,
        .sidebar .brand .kicker,
        .nav-item span.label,
        .nav-sep,
        .nav-badge {
          display: none;
        }
        .nav-item {
          justify-content: center;
          padding: 12px 0;
        }
        .content {
          padding: 16px;
        }
      }
      @media (max-width: 640px) {
        #loginScreen {
          align-items: flex-start;
          padding: 16px;
        }
        .login-card {
          margin-top: 8vh;
          padding: 28px 20px;
        }
        .shell {
          display: block;
        }
        .sidebar {
          width: 100%;
          height: auto;
          max-height: none;
          padding: 12px 0 0;
          border-right: none;
          border-bottom: 1px solid var(--line);
          overflow: hidden;
        }
        .sidebar .brand {
          padding: 0 16px 12px;
          margin-bottom: 0;
        }
        .sidebar .brand .kicker,
        .sidebar .brand h2,
        .nav-item span.label,
        .nav-badge {
          display: block;
        }
        .nav-sep {
          display: none;
        }
        .sidebar .brand .kicker {
          font-size: 10px;
        }
        .sidebar .brand h2 {
          font-size: 16px;
        }
        #navItems {
          display: flex;
          gap: 4px;
          padding: 8px 12px 10px;
          overflow-x: auto;
          scrollbar-width: thin;
        }
        .nav-item {
          flex: 0 0 auto;
          justify-content: flex-start;
          gap: 8px;
          padding: 9px 11px;
          border-left: none;
          border-bottom: 2px solid transparent;
          border-radius: 4px;
          white-space: nowrap;
        }
        .nav-item.active {
          border-left-color: transparent;
          border-bottom-color: var(--amber);
        }
        .nav-item .nl {
          gap: 7px;
        }
        .main {
          min-height: calc(100vh - 108px);
        }
        .topbar {
          height: auto;
          min-height: 60px;
          align-items: stretch;
          flex-direction: column;
          padding: 12px;
          gap: 10px;
        }
        .topbar-left,
        .topbar-right {
          width: 100%;
        }
        .topbar-left .outlet-select,
        .topbar-left .outlet-select select,
        .topbar-left .page-title {
          width: 100%;
        }
        .topbar-left .outlet-select select {
          padding: 9px 10px;
        }
        .topbar-right {
          justify-content: space-between;
        }
        .topbar-right .btn {
          flex: 0 0 auto;
        }
        .content {
          padding: 16px 12px 24px;
          overflow-x: hidden;
        }
        .page-title {
          font-size: 20px;
        }
        .page-sub {
          line-height: 1.45;
        }
        .cards-row {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
          margin-bottom: 16px;
        }
        .stat-card {
          min-width: 0;
          padding: 13px 12px;
        }
        .stat-card .value {
          font-size: 20px;
          overflow-wrap: anywhere;
        }
        .panel {
          padding: 14px;
          margin-bottom: 14px;
          overflow-x: auto;
        }
        .panel-head {
          align-items: flex-start;
        }
        .panel-head h3 {
          line-height: 1.35;
        }
        .toolbar {
          width: 100%;
        }
        .toolbar > * {
          min-width: 0 !important;
          flex: 1 1 140px;
        }
        .toolbar .btn {
          flex: 1 1 auto;
        }

      /* ---------------- cloud database (Google Sheet) ---------------- */
      // Apps Script Web Apps respond via a redirect that browsers often CORS-block when read
      // through fetch(). JSONP (a <script> tag, not fetch) sidesteps CORS entirely for reads.
      function cloudFetchAll() {
        return new Promise((resolve) => {
          if (!state.cloudUrl) {
            resolve(null);
            return;
          }
          const cbName = "cloudCB_" + Math.random().toString(36).slice(2);
          const script = document.createElement("script");
          const cleanup = () => {
            delete window[cbName];
            script.remove();
          };
          const timeout = setTimeout(() => {
            cleanup();
            resolve(null);
          }, 10000);
          window[cbName] = (data) => {
            clearTimeout(timeout);
            cleanup();
            resolve(data);
          };
          script.onerror = () => {
            clearTimeout(timeout);
            cleanup();
            resolve(null);
          };
          script.src = state.cloudUrl + "?action=getAll&callback=" + cbName;
          document.body.appendChild(script);
        });
      }
      function cloudSet(key, jsonValue) {
        if (!state.cloudUrl) return Promise.resolve();
        // no-cors: the write still reaches the script server-side; we just can't (and don't need to) read the response.
        return fetch(state.cloudUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ key, value: jsonValue }),
        }).catch((e) => console.error("Cloud sync failed for", key, e));
      }

      /* ---------------- storage helpers ---------------- */
      async function storeGet(key, fallback) {
        if (
          cloudCache &&
          Object.prototype.hasOwnProperty.call(cloudCache, key)
        ) {
          try {
            return JSON.parse(cloudCache[key]);
          } catch (e) {
            /* fall through */
          }
        }
        try {
          const r = await window.storage.get(key, true);
          if (r && r.value !== undefined) return JSON.parse(r.value);
          return fallback;
        } catch (e) {
          return fallback;
        }
      }
      async function storeSet(key, value) {
        try {
          await window.storage.set(key, JSON.stringify(value), true);
        } catch (e) {
          toast("Save failed — check connection.", true);
        }
        if (state.cloudUrl) cloudSet(key, JSON.stringify(value));
      }
      function priceNum(p) {
        if (typeof p === "number") return p;
        if (!p) return 0;
        const n = parseFloat(String(p).replace(/[^0-9.\-]/g, ""));
        return isNaN(n) ? 0 : n;
      }
      function closingOf(item) {
        return round2(
          (item.opening || 0) + (item.qtyIn || 0) - (item.qtyOut || 0),
        );
      }
      function round2(n) {
        return Math.round(n * 100) / 100;
      }
      function uid(prefix) {
        return (
          prefix +
          "_" +
          Math.random().toString(36).slice(2, 9) +
          Date.now().toString(36).slice(-4)
        );
      }
      function todayStr() {
        return new Date().toISOString().slice(0, 10);
      }
      function fmtNum(n) {
        const num = Number(n) || 0;
        return num.toLocaleString("en-US", { maximumFractionDigits: 2 });
      }
      function fmtMoney(n) {
        const num = Number(round2(n)) || 0;
        return (
          (state.org && state.org.currencySymbol
            ? state.org.currencySymbol
            : "$") +
          num.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          })
        );
      }
      function fmtDate(iso) {
        if (!iso) return "—";
        const p = String(iso).split("-");
        if (p.length !== 3) return iso;
        return p[2] + "/" + p[1] + "/" + p[0];
      }
      function esc(s) {
        return s === null || s === undefined
          ? ""
          : String(s).replace(
              /[&<>"']/g,
              (c) =>
                ({
                  "&": "&amp;",
                  "<": "&lt;",
                  ">": "&gt;",
                  '"': "&quot;",
                  "'": "&#39;",
                })[c],
            );
      }
      function toast(msg, isError) {
        const el = document.createElement("div");
        el.className = "toast" + (isError ? " error" : "");

        document.getElementById("toastRoot").appendChild(el);
        setTimeout(() => el.remove(), 3200);
      }
      function expiryStatus(dateStr) {
        if (!dateStr) return null;
        const days = Math.floor(
          (new Date(dateStr + "T00:00:00") -
            new Date(todayStr() + "T00:00:00")) /
            86400000,
        );
        let status;
        if (days < 0) status = "expired";
        else if (days <= 30) status = "within1m";
        else if (days <= 90) status = "within3m";
        else if (days <= 180) status = "within6m";
        else status = "ok";
        return { status, days };
      }

      async function saveStock(outlet) {
        await storeSet("os_stock:" + outlet, state.stock[outlet]);
        await upsertSnapshotToday(outlet);
      }
      async function upsertSnapshotToday(outlet) {
        const items = state.stock[outlet] || [];
        const snapItems = items.map((it) => ({
          sku: it.sku,
          name: it.name,
          cat: it.cat,
          unit: it.unit,
          price: it.price,
          expiryDate: it.expiryDate || "",
          closing: closingOf(it),
          value: round2(closingOf(it) * it.price),
        }));
        const totalValue = round2(snapItems.reduce((s, i) => s + i.value, 0));
        const snaps = state.snapshots[outlet] || [];
        const today = todayStr();
        const idx = snaps.findIndex((s) => s.date === today);
        const entry = { date: today, items: snapItems, totalValue };
        if (idx >= 0) snaps[idx] = entry;
        else snaps.push(entry);
        snaps.sort((a, b) => a.date.localeCompare(b.date));
        state.snapshots[outlet] = snaps;
        await storeSet("os_snapshots:" + outlet, snaps);
      }
      async function logMovement(outlet, entry) {
        const mv = state.movements[outlet];
        mv.unshift({
          id: uid("mv"),
          date: entry.date || todayStr(),
          timestamp: Date.now(),
          type: entry.type,
          sku: entry.sku,
          name: entry.name,
          qty: entry.qty,
          note: entry.note || "",
          value: entry.value !== undefined ? entry.value : null,
          supplier: entry.supplier || "",
          ref: entry.ref || "",
          user: state.user.username,
        });
        await storeSet("os_movements:" + outlet, mv);
      }

        if (expired.length === 0 && soon.length === 0) return "";

    <button class="btn btn-ghost btn-sm" onclick="setTab('expiry')">Review expiry list &rarr;</button>
  </div>`;
      }

      /* ---------------- OVERVIEW ---------------- */
      function renderOverview() {
        const wrap = document.createElement("div");
        let grand = 0;
        OUTLETS.forEach((o) => {
          grand += (state.stock[o] || []).reduce(
            (s, it) => s + closingOf(it) * it.price,

        });
        let html = `<h1 class="page-title">All Outlets Overview</h1><p class="page-sub">Head Office view across all 5 outlets.</p>
  <div class="cards-row">
    <div class="stat-card"><div class="label">TOTAL STOCK VALUE</div><div class="value amber">${fmtMoney(grand)}</div></div>

    <div class="stat-card"><div class="label">OPEN PURCHASE ORDERS</div><div class="value">${OUTLETS.reduce((s, o) => s + (state.pos[o] || []).filter((p) => ["pending", "approved", "sent"].includes(p.status)).length, 0)}</div></div>

        OUTLETS.forEach((o) => {

            ["pending", "approved", "sent"].includes(p.status),
          ).length;
          html += `<tr><td><b>${esc(o)}</b></td><td class="right num">${items.length}</td>
      <td class="right num">${fmtMoney(value)}</td>
      <td class="right num">${low > 0 ? `<span class="tag tag-red">${low}</span>` : `<span class="tag tag-teal">0</span>`}</td>

      function openOutletFrom(o) {

        state.tab = "ledger";

      }

      /* ---------------- LEDGER ---------------- */
      function ledgerFilterBar() {
        const cats = allCategoryNames();
        return `<div class="toolbar" style="margin-top:10px;">
    <input class="search-input" placeholder="Search name, SKU, category…" value="${esc(state.search || "")}" oninput="onFilterChange('search', this.value)">
    <select class="search-input" style="min-width:150px;" onchange="onFilterChange('cat', this.value)">
      <option value="">All categories</option>${cats.map((c) => `<option value="${esc(c)}" ${state.filterCategory === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
    </select>
    <select class="search-input" style="min-width:170px;" onchange="onFilterChange('exp', this.value)">
      <option value="">All expiry statuses</option>
      <option value="expired" ${state.filterExpiry === "expired" ? "selected" : ""}>Expired</option>
      <option value="within1m" ${state.filterExpiry === "within1m" ? "selected" : ""}>Within 1 month</option>
      <option value="within3m" ${state.filterExpiry === "within3m" ? "selected" : ""}>Within 3 months</option>
      <option value="within6m" ${state.filterExpiry === "within6m" ? "selected" : ""}>Within 6 months</option>
      <option value="ok" ${state.filterExpiry === "ok" ? "selected" : ""}>OK (6+ months)</option>
      <option value="none" ${state.filterExpiry === "none" ? "selected" : ""}>No expiry date set</option>
    </select>
  </div>`;
      }
      function onFilterChange(kind, val) {
        if (kind === "search") state.search = val;
        else if (kind === "cat") state.filterCategory = val;
        else if (kind === "exp") state.filterExpiry = val;
        renderApp();
      }
      function applyRowFilters(rows) {
        const q = (state.search || "").toLowerCase();
        return rows.filter((r) => {
          if (
            q &&
            !(
              r.sku.toLowerCase().includes(q) ||
              (r.name || "").toLowerCase().includes(q) ||
              (r.cat || "").toLowerCase().includes(q)
            )
          )
            return false;
          if (state.filterCategory && r.cat !== state.filterCategory)
            return false;
          if (state.filterExpiry) {
            if (state.filterExpiry === "none") {
              if (r.expiryDate) return false;
            } else {
              const es = r.expiryDate ? expiryStatus(r.expiryDate) : null;
              if (!es || es.status !== state.filterExpiry) return false;
            }
          }
          return true;
        });
      }
      function renderLedger() {
        const wrap = document.createElement("div");
        const isAll = state.outlet === "ALL";
        const isLive = isAll || !state.viewDate || state.viewDate === "live";
        let rows = [];
        let noteLabel = "";
        if (isAll) {
          rows = liveRowsAll();
        } else if (isLive) {
          rows = liveRowsForOutlet(state.outlet);
        } else {
          const snaps = (state.snapshots[state.outlet] || [])
            .filter((s) => s.date <= state.viewDate)
            .sort((a, b) => b.date.localeCompare(a.date));
          const candidate = snaps[0];
          if (candidate) {
            rows = candidate.items.map((i) =>
              Object.assign({}, i, { _outlet: state.outlet }),
            );
            if (candidate.date !== state.viewDate)
              noteLabel = ` — nearest record available: ${fmtDate(candidate.date)}`;
          }
        }
        const filtered = isLive ? applyRowFilters(rows) : rows;
        state.currentLedgerRows = filtered;
        const totalValue = round2(filtered.reduce((s, r) => s + r.value, 0));
        const lowCount = filtered.filter((r) => r.closing <= 0).length;

        let html = `<h1 class="page-title">Stock Ledger</h1>
  <p class="page-sub">Opening &rarr; In &rarr; Out &rarr; Closing, checked against your physical count.</p>
  <div class="cards-row">
    <div class="stat-card"><div class="label">ITEMS</div><div class="value">${filtered.length}</div></div>
    <div class="stat-card"><div class="label">STOCK VALUE${isLive ? " (LIVE)" : " (AS OF " + fmtDate(state.viewDate) + ")"}</div><div class="value amber">${fmtMoney(totalValue)}</div></div>
    <div class="stat-card"><div class="label">ZERO / NEGATIVE ITEMS</div><div class="value ${lowCount > 0 ? "red" : "teal"}">${lowCount}</div></div>
  </div>
  <div class="panel">
    <div class="panel-head">
      <h3>Inventory — ${isAll ? "All Outlets" : esc(state.outlet)}${isLive ? "" : noteLabel}</h3>
      <div class="toolbar">
        <label style="font-size:12px;color:var(--muted);">View value as of</label>
        <input type="date" class="search-input" style="min-width:auto;" value="${isLive && !isAll ? todayStr() : state.viewDate || todayStr()}" max="${todayStr()}" onchange="setLedgerDate(this.value)" ${isAll ? "disabled" : ""}>
        ${!isLive ? '<button class="btn btn-ghost btn-sm" onclick="setLedgerDate(\'live\')">Back to live</button>' : ""}
        <button class="btn btn-ghost btn-sm" onclick="exportExcel()">Export Excel</button>
        <button class="btn btn-ghost btn-sm" onclick="exportPDF()">Export PDF</button>
        ${!isAll && isLive ? '<button class="btn btn-ghost btn-sm" onclick="openAddItemModal()">+ Add item</button>' : ""}
      </div>
    </div>`;
        if (isLive) html += ledgerFilterBar();

        if (filtered.length === 0) {
          html += `<div class="empty-state"><div class="display">No items to show</div>
      <p>${isLive ? `Try adjusting your filters, or add a stock item.` : `No stock record exists on or before this date.`}</p></div>`;
        } else if (isLive) {
          html += `<table><thead><tr>${isAll ? "<th>Outlet</th>" : ""}<th>SKU</th><th>Category</th><th>Item</th><th>Unit</th><th class="right">Price</th>
      <th class="right">Opening</th><th class="right">In</th><th class="right">Out</th><th class="right">Closing</th>
      ${isAll ? "" : '<th class="right">Physical</th><th class="right">Variance</th>'}<th>Expiry</th>${isAll ? "" : "<th></th>"}</tr></thead><tbody>`;
          filtered.forEach((r) => {
            const it = r;
            const variance = round2((it.physical || 0) - r.closing);
            const vTag =
              variance === 0
                ? `<span class="tag tag-teal">0</span>`
                : variance > 0
                  ? `<span class="tag tag-amber">+${variance}</span>`
                  : `<span class="tag tag-red">${variance}</span>`;
            const es = it.expiryDate ? expiryStatus(it.expiryDate) : null;
            const expColor = es
              ? es.status === "expired"
                ? "var(--red)"
                : ["within1m", "within3m"].includes(es.status)
                  ? "var(--amber)"
                  : "var(--muted)"
              : "var(--muted)";
            html += `<tr>
        ${isAll ? `<td>${esc(it._outlet)}</td>` : ""}
        <td class="mono">${esc(it.sku)}</td><td>${esc(it.cat)}</td>
        <td><button class="item-link" onclick="openItemDetail('${it._outlet}','${it.id}')">${esc(it.name)}</button></td>
        <td class="mono">${esc(it.unit)}</td>
        <td class="right num">${fmtMoney(it.price)}</td><td class="right num">${fmtNum(it.opening)}</td>
        <td class="right num" style="color:var(--teal)">${it.qtyIn > 0 ? "+" + fmtNum(it.qtyIn) : fmtNum(it.qtyIn)}</td>
        <td class="right num" style="color:var(--red)">${it.qtyOut > 0 ? "-" + fmtNum(it.qtyOut) : fmtNum(it.qtyOut)}</td>
        <td class="right num"><b>${fmtNum(r.closing)}</b></td>
        ${isAll ? "" : `<td class="right"><input class="mini-input num" type="number" step="0.1" value="${it.physical}" onchange="updatePhysical('${it._outlet}','${it.id}', this.value)"></td><td class="right">${vTag}</td>`}
        <td><input type="date" class="mini-input" style="width:118px;text-align:left;color:${expColor};" value="${it.expiryDate || ""}" onchange="updateExpiry('${it._outlet}','${it.id}', this.value)"></td>
        ${
          isAll
            ? ""
            : `<td class="right" style="white-space:nowrap;">
          <button class="icon-btn" title="Quick adjustment" onclick="openManualMoveModal('${it._outlet}','${it.id}')">&#8942;</button>
          <button class="icon-btn" title="Edit item" onclick="openEditItemModal('${it._outlet}','${it.id}')">&#9998;</button></td>`
        }
      </tr>`;
          });
          html += `</tbody></table>`;
        } else {
          html += `<table><thead><tr><th>SKU</th><th>Category</th><th>Item</th><th>Unit</th><th class="right">Price</th><th class="right">Qty on hand</th><th class="right">Value</th><th>Expiry</th></tr></thead><tbody>`;
          filtered.forEach((r) => {
            html += `<tr><td class="mono">${esc(r.sku)}</td><td>${esc(r.cat)}</td><td>${esc(r.name)}</td><td class="mono">${esc(r.unit)}</td>
        <td class="right num">${fmtMoney(r.price)}</td><td class="right num">${r.closing}</td><td class="right num"><b>${fmtMoney(r.value)}</b></td><td>${esc(r.expiryDate || "—")}</td></tr>`;
          });
          html += `</tbody></table>`;
        }
        html += `</div>`;
        wrap.innerHTML = html;
        return wrap;
      }
      function setLedgerDate(v) {
        state.viewDate = v;
        renderApp();
      }

      async function updatePhysical(outlet, itemId, val) {
        const items = state.stock[outlet];
        const it = items.find((x) => x.id === itemId);
        if (!it) return;
        const newVal = parseFloat(val);
        if (isNaN(newVal)) return;
        const oldVal = it.physical;
        it.physical = round2(newVal);
        it.physicalDate = todayStr();
        await saveStock(outlet);
        if (oldVal !== it.physical)
          await logMovement(outlet, {
            type: "physical-count",
            sku: it.sku,
            name: it.name,
            qty: round2(it.physical - oldVal),
            note: `Physical count updated: ${oldVal} → ${it.physical}`,
          });
        toast(`Physical count saved for ${it.name}.`);
        renderApp();
      }
      async function updateExpiry(outlet, itemId, val) {
        const items = state.stock[outlet];
        const it = items.find((x) => x.id === itemId);
        if (!it) return;
        it.expiryDate = val;
        await saveStock(outlet);
        toast(`Expiry date saved for ${it.name}.`);
        renderApp();
      }

      /* -------- item detail / movement drawer -------- */
      function openItemDetail(outlet, itemId) {
        const it = state.stock[outlet].find((x) => x.id === itemId);
        if (!it) return;
        const mv = (state.movements[outlet] || [])
          .filter((m) => m.sku === it.sku)
          .slice()
          .reverse();
        let rows = `<tr><td class="mono">${it.physicalDate || "—"}</td><td><span class="tag tag-muted">Opening</span></td>
    <td class="right num">${it.opening}</td><td>Opening balance</td><td>—</td></tr>`;
        mv.forEach((m) => {
          const typeTag =
            {
              "sale-out": '<span class="tag tag-red">Sale</span>',
              "manual-in": '<span class="tag tag-teal">Manual In</span>',
              "manual-out": '<span class="tag tag-amber">Manual Out</span>',
              "physical-count": '<span class="tag tag-muted">Count Adj.</span>',
              "stock-in": '<span class="tag tag-teal">Stock In</span>',
              "transfer-out": '<span class="tag tag-red">Transfer Out</span>',
              "transfer-in": '<span class="tag tag-teal">Transfer In</span>',
              "purchase-received":
                '<span class="tag tag-blue">PO Received</span>',
              "opening-adjustment":
                '<span class="tag tag-amber">Opening Adj.</span>',
            }[m.type] || m.type;
          rows += `<tr><td class="mono">${fmtDate(m.date)}</td><td>${typeTag}</td>
      <td class="right num" style="color:${m.qty < 0 ? "var(--red)" : "var(--teal)"}">${m.qty > 0 ? "+" : ""}${m.qty}</td>
      <td style="font-size:12px;color:var(--muted);">${esc(m.note)}</td><td class="mono" style="font-size:12px;">${esc(m.user)}</td></tr>`;
        });
        showModal(
          `<h3>${esc(it.name)} <span class="mono" style="font-size:12px;color:var(--muted);">(${esc(it.sku)})</span></h3>
    <div class="cards-row" style="margin-bottom:14px;">
      <div class="stat-card"><div class="label">OPENING</div><div class="value">${it.opening}</div></div>
      <div class="stat-card"><div class="label">CLOSING (STOCK ON HAND)</div><div class="value amber">${closingOf(it)}</div></div>
      <div class="stat-card"><div class="label">PHYSICAL COUNT</div><div class="value">${it.physical}</div></div>
    </div>
    <button class="btn btn-ghost btn-sm" style="margin-bottom:12px;" onclick="promptAdjustOpening('${outlet}','${itemId}')">Adjust opening (correction)</button>
    <table><thead><tr><th>Date</th><th>Type</th><th class="right">Qty</th><th>Note</th><th>By</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="modal-actions"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button></div>`,
          true,
        );
      }
      async function promptAdjustOpening(outlet, itemId) {
        const it = state.stock[outlet].find((x) => x.id === itemId);
        if (!it) return;
        const val = window.prompt(
          `Correct opening stock for ${it.name} (${it.unit}). Current: ${it.opening}`,
          it.opening,
        );
        if (val === null) return;
        const num = parseFloat(val);
        if (isNaN(num)) {
          toast("Enter a valid number.", true);
          return;
        }
        const old = it.opening;
        it.opening = round2(num);
        await saveStock(outlet);
        await logMovement(outlet, {
          type: "opening-adjustment",
          sku: it.sku,
          name: it.name,
          qty: round2(it.opening - old),
          note: `Opening corrected: ${old} → ${it.opening}`,
        });
        toast("Opening stock corrected.");
        openItemDetail(outlet, itemId);
        renderApp();
      }

      /* -------- export -------- */
      function printHtmlDoc(title, innerHtml) {
        const win = window.open("", "_blank");
        if (!win) {
          toast(
            "Pop-up blocked — allow pop-ups for this site, or use Export Excel instead.",
            true,
          );
          return;
        }
        win.document
          .write(`<!DOCTYPE html><html><head><title>${title}</title><meta charset="utf-8"><style>
    body{font-family:Arial,Helvetica,sans-serif;padding:24px;color:#000;background:#fff;}
    table{width:100%;border-collapse:collapse;margin-top:10px;}
    th,td{border:1px solid #999;padding:6px 8px;font-size:12px;text-align:left;}
    h2{margin-bottom:4px;}
  </style></head><body>${innerHtml}<script>window.onload=function(){setTimeout(function(){window.print();},250);};<\/script></body></html>`);
        win.document.close();
        win.focus();
      }
      function checkXlsxReady() {
        if (typeof XLSX === "undefined") {
          toast(
            "Excel library hasn't loaded yet — check your connection and try again.",
            true,
          );
          return false;
        }
        return true;
      }
      function exportExcel() {
        const rows = state.currentLedgerRows || [];
        if (rows.length === 0) {
          toast("Nothing to export.", true);
          return;
        }
        if (!checkXlsxReady()) return;
        try {
          const hasOutlet = state.outlet === "ALL";
          const aoa = [
            (hasOutlet ? ["Outlet"] : []).concat([
              "SKU",
              "Category",
              "Item",
              "Unit",
              "Price",
              "Qty on hand",
              "Value",
              "Expiry Date",
            ]),
          ];
          rows.forEach((r) =>
            aoa.push(
              (hasOutlet ? [r._outlet] : []).concat([
                r.sku,
                r.cat,
                r.name,
                r.unit,
                r.price,
                r.closing,
                r.value,
                r.expiryDate || "",
              ]),
            ),
          );
          const ws = XLSX.utils.aoa_to_sheet(aoa);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Stock Value");
          const dateLabel =
            state.viewDate && state.viewDate !== "live"
              ? state.viewDate
              : todayStr();
          XLSX.writeFile(
            wb,
            state.outlet.replace(/\s+/g, "_") +
              "_stock_value_" +
              dateLabel +
              ".xlsx",
          );
        } catch (e) {
          toast("Export failed.", true);
        }
      }
      function exportPDF() {
        const rows = state.currentLedgerRows || [];
        if (rows.length === 0) {
          toast("Nothing to export.", true);
          return;
        }
        const dateLabel =
          state.viewDate && state.viewDate !== "live"
            ? state.viewDate
            : todayStr();
        const hasOutlet = state.outlet === "ALL";
        let total = 0;
        let html = `<h2>${esc(state.org.name || "Ostro Nightlife")} — ${esc(state.outlet === "ALL" ? "All Outlets" : state.outlet)} Stock Value as of ${dateLabel}</h2>
    <table><thead><tr>${hasOutlet ? "<th>Outlet</th>" : ""}<th>SKU</th><th>Category</th><th>Item</th><th>Unit</th><th>Price</th><th>Qty on hand</th><th>Value</th><th>Expiry Date</th></tr></thead><tbody>`;
        rows.forEach((r) => {
          total += r.value;
          html += `<tr>${hasOutlet ? `<td>${esc(r._outlet)}</td>` : ""}<td>${esc(r.sku)}</td><td>${esc(r.cat)}</td><td>${esc(r.name)}</td><td>${esc(r.unit)}</td><td>${fmtMoney(r.price)}</td><td>${fmtNum(r.closing)}</td><td>${fmtMoney(r.value)}</td><td>${esc(r.expiryDate ? fmtDate(r.expiryDate) : "—")}</td></tr>`;
        });
        html += `</tbody></table><p><b>Total stock value: ${fmtMoney(total)}</b></p>`;
        printHtmlDoc("Stock Value Report", html);
      }

      /* -------- add / edit item -------- */
      function categoryOptionsHtml(selected) {

          .map(
            (c) =>
              `<option value="${esc(c)}" ${c === selected ? "selected" : ""}>${esc(c)}</option>`,

      }
      function openAddItemModal() {
        showModal(`<h3>Add stock item — ${esc(state.outlet)}</h3>
    <div class="field"><label>SKU</label><input id="niSku" placeholder="e.g. B1801-BL"></div>
    <div class="field"><label>Category</label><input id="niCat" list="catList" placeholder="e.g. Spirits"><datalist id="catList">${categoryOptionsHtml()}</datalist></div>

    <div class="field"><label>Barcode (optional)</label><div style="display:flex;gap:8px;"><input id="niBarcode" placeholder="Scan or type" style="flex:1;"><button class="btn btn-ghost btn-sm" onclick="openScanModal('niBarcode')">Scan</button></div></div>
    <div class="field"><label>Expiry date (optional)</label><input id="niExpiry" type="date"></div>
    <div class="modal-actions"><button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" style="width:auto" onclick="saveNewItem()">Add item</button></div>`);
      }
      async function saveNewItem() {
        const sku = document.getElementById("niSku").value.trim();
        const name = document.getElementById("niName").value.trim();
        if (!sku || !name) {
          toast("SKU and item name are required.", true);
          return;

      /* ---------------- PASTE SALES ---------------- */
      function heuristicRow(parts) {
        let qty = null,
          qtyIdx = -1;
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = String(parts[i]).trim();
          if (p !== "" && /^-?\d+(\.\d+)?$/.test(p.replace(/,/g, ""))) {
            qty = parseFloat(p);
            qtyIdx = i;
            break;
          }
        }
        if (qty === null) return null;
        let code = null;
        for (let i = 0; i < parts.length; i++) {
          if (i === qtyIdx) continue;
          const p = String(parts[i]).trim();
          if (
            /^[A-Za-z0-9][A-Za-z0-9\-\._]{1,14}$/.test(p) &&
            /[A-Za-z]/.test(p) &&
            p.length <= 16 &&
            !/^\d+(\.\d+)?$/.test(p)
          ) {
            code = p;
            break;
          }
        }
        const rawName =
          parts
            .map((p) => String(p).trim())
            .find((p, i) => i !== qtyIdx && p.length > 3 && p !== code) ||
          String(parts[0]).trim();
        return { code, rawName, qty: Math.abs(qty) };
      }
      function detectHeader(row, patterns) {
        const idx = {};
        row.forEach((cell, i) => {
          const c = String(cell || "")
            .toLowerCase()
            .trim();
          for (const key in patterns) {
            if (idx[key] === undefined && patterns[key].test(c)) idx[key] = i;
          }
        });
        return idx;
      }
      function buildSalesPreview(matrix) {
        const mapping = state.mapping[state.outlet] || {};
        const stockBySku = {};
        (state.stock[state.outlet] || []).forEach(
          (it) => (stockBySku[it.sku.toUpperCase()] = it),
        );
        if (matrix.length === 0) return [];
        const headerIdx = detectHeader(matrix[0], {
          code: /sku|item code|^code$/,
          name: /item|menu|name/,
          qty: /qty|quantity|sold/,
        });
        let dataRows = matrix;
        let useHeader = false;
        if (
          headerIdx.qty !== undefined &&
          (headerIdx.code !== undefined || headerIdx.name !== undefined)
        ) {
          useHeader = true;
          dataRows = matrix.slice(1);
        }
        const rows = [];
        dataRows.forEach((r) => {
          if (r.every((c) => String(c).trim() === "")) return;
          let code = null,
            rawName = null,
            qty = null;
          if (useHeader) {
            code =
              headerIdx.code !== undefined
                ? String(r[headerIdx.code] || "").trim()
                : null;
            rawName =
              headerIdx.name !== undefined
                ? String(r[headerIdx.name] || "").trim()
                : code || "Item";
            qty =
              headerIdx.qty !== undefined ? parseFloat(r[headerIdx.qty]) : NaN;
            if (isNaN(qty)) return;
            qty = Math.abs(qty);
          } else {
            const h = heuristicRow(r);
            if (!h) return;
            code = h.code;
            rawName = h.rawName;
            qty = h.qty;
          }
          let sku = null;
          if (code) {
            if (stockBySku[code.toUpperCase()])
              sku = stockBySku[code.toUpperCase()].sku;
            else if (mapping[code.toUpperCase()])
              sku = mapping[code.toUpperCase()].sku;
          }
          if (!sku && rawName && mapping[rawName.toUpperCase()])
            sku = mapping[rawName.toUpperCase()].sku;
          rows.push({ code, rawName, qty, sku });
        });
        return rows;
      }
      function textToMatrix(raw) {
        return raw
          .split(/\r?\n/)
          .map((l) => l.trim())
          .filter((l) => l.length > 0)
          .map((line) =>
            line
              .split(/\t|,(?![^"]*")/)
              .map((p) => p.replace(/^"|"$/g, "").trim()),
          );
      }
      function renderPaste() {
        const wrap = document.createElement("div");
        let html = `<h1 class="page-title">Paste Sales</h1>

        <td><button class="btn btn-ghost btn-sm" onclick="ignorePasteRow(${idx})">Ignore</button></td></tr>`;
          }
        });
        html += `</tbody></table><div class="modal-actions" style="justify-content:flex-start;margin-top:16px;">

      function parsePasteText() {
        const raw = document.getElementById("pasteArea").value;
        if (!raw.trim()) {
          toast("Paste some rows first.", true);
          return;
        }
        const rows = buildSalesPreview(textToMatrix(raw));
        if (rows.length === 0) {

      function handleSalesFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          try {
            const wb = XLSX.read(ev.target.result, { type: "binary" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const matrix = XLSX.utils
              .sheet_to_json(ws, { header: 1, defval: "" })
              .filter((r) => r.length > 0);
            const rows = buildSalesPreview(matrix);
            if (rows.length === 0) {
              toast("No valid rows detected in file.", true);
              return;
            }
            state.pasteRows = rows;
            renderApp();
          } catch (err) {
            toast("Could not read file — check it's a valid Excel/CSV.", true);
          }
        };
        reader.readAsBinaryString(file);
      }
      function mapPasteRow(idx, sku) {
        if (!sku) return;
        state.pasteRows[idx].sku = sku;

      function ignorePasteRow(idx) {
        state.pasteRows.splice(idx, 1);

      async function confirmPaste() {
        const rows = state.pasteRows.filter((r) => r.sku);
        if (rows.length === 0) {
          toast("Nothing to apply — map or ignore unmatched rows first.", true);
          return;

        const recDate =
          (document.getElementById("salesRecordDate") || {}).value ||
          todayStr();
        const items = state.stock[state.outlet];

        let applied = 0;
        for (const r of rows) {
          const it = items.find((x) => x.sku === r.sku);

          await logMovement(state.outlet, {

          applied++;

        await saveStock(state.outlet);
        await storeSet("os_mapping:" + state.outlet, mapping);
        state.pasteRows = null;
        toast(
          `Applied ${applied} deduction(s) to ${state.outlet} stock, dated ${recDate}.`,
        );
        renderApp();
      }

      function buildStockInPreview(matrix) {
        const stockBySku = {};
        (state.stock[state.outlet] || []).forEach(
          (it) => (stockBySku[it.sku.toUpperCase()] = it),
        );
        if (matrix.length === 0) return [];
        const headerIdx = detectHeader(matrix[0], {
          sku: /sku|code/,
          name: /item|name/,
          qty: /qty|quantity/,
          cost: /cost|price/,
          supplier: /supplier|vendor/,
          date: /date/,
          note: /note|remark/,
        });
        let dataRows = matrix.slice(1);
        if (headerIdx.sku === undefined && headerIdx.qty === undefined) {
          dataRows = matrix;
          headerIdx.sku = 0;
          headerIdx.name = 1;
          headerIdx.qty = 2;
        }
        const rows = [];
        dataRows.forEach((r) => {
          if (r.every((c) => String(c).trim() === "")) return;
          const sku =
            headerIdx.sku !== undefined
              ? String(r[headerIdx.sku] || "").trim()
              : "";
          const name =
            headerIdx.name !== undefined
              ? String(r[headerIdx.name] || "").trim()
              : "";
          const qty =
            headerIdx.qty !== undefined ? parseFloat(r[headerIdx.qty]) : NaN;
          if (!sku || isNaN(qty)) return;
          const cost =
            headerIdx.cost !== undefined ? parseFloat(r[headerIdx.cost]) : NaN;
          const supplier =
            headerIdx.supplier !== undefined
              ? String(r[headerIdx.supplier] || "").trim()
              : "";
          const note =
            headerIdx.note !== undefined
              ? String(r[headerIdx.note] || "").trim()
              : "";
          let date =
            headerIdx.date !== undefined
              ? String(r[headerIdx.date] || "").trim()
              : "";
          if (date && /^\d+$/.test(date)) date = "";
          const match = stockBySku[sku.toUpperCase()];
          rows.push({
            sku,
            name: name || (match ? match.name : sku),
            qty: Math.abs(qty),
            cost: isNaN(cost) ? null : cost,
            supplier,
            date: date || todayStr(),
            note,
            matched: !!match,
            create: false,
          });
        });
        return rows;
      }
      function handleStockInFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          try {
            const wb = XLSX.read(ev.target.result, { type: "binary" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const matrix = XLSX.utils
              .sheet_to_json(ws, { header: 1, defval: "" })
              .filter((r) => r.length > 0);
            const rows = buildStockInPreview(matrix);
            if (rows.length === 0) {
              toast("No valid rows detected in file.", true);
              return;
            }
            state.stockInRows = rows;
            renderApp();
          } catch (err) {
            toast("Could not read file — check it's a valid Excel/CSV.", true);
          }
        };
        reader.readAsBinaryString(file);
      }

        }
        for (const l of d.lines) {
          const srcItem = state.stock[d.from].find((i) => i.sku === l.sku);
          if (!srcItem) continue;
          srcItem.qtyOut = round2((srcItem.qtyOut || 0) + l.qty);
          await logMovement(d.from, {
            type: "transfer-out",
            date: d.date,
            sku: srcItem.sku,
            name: srcItem.name,
            qty: -l.qty,
            note: `Transfer to ${d.to}${d.note ? ": " + d.note : ""}`,
          });
          const toItems = state.stock[d.to];
          let destItem = toItems.find((i) => i.sku === l.sku);
          if (!destItem) {
            destItem = {
              id: uid("it"),
              sku: srcItem.sku,
              cat: srcItem.cat,
              subcat: srcItem.subcat,
              name: srcItem.name,
              unit: srcItem.unit,
              price: srcItem.price,
              opening: 0,
              qtyIn: 0,
              qtyOut: 0,
              physical: 0,
              physicalDate: todayStr(),
              expiryDate: "",
              barcode: srcItem.barcode || "",
              lastSupplier: srcItem.lastSupplier || "",
            };
            toItems.push(destItem);
          }
          destItem.qtyIn = round2((destItem.qtyIn || 0) + l.qty);
          await logMovement(d.to, {
            type: "transfer-in",
            date: d.date,
            sku: destItem.sku,
            name: destItem.name,
            qty: l.qty,
            note: `Transfer from ${d.from}${d.note ? ": " + d.note : ""}`,
          });
        }
        await saveStock(d.from);
        await saveStock(d.to);
        state.transfers.unshift({
          id: uid("tr"),
          date: d.date,
          from: d.from,
          to: d.to,
          lines: d.lines,
          note: d.note,
          user: state.user.username,
        });
        await storeSet("os_transfers", state.transfers);
        toast(
          `Transferred ${d.lines.length} item(s) from ${d.from} to ${d.to}.`,
        );
        state.transferDraft = null;
        renderApp();
      }

        const item = (state.stock[state.outlet] || []).find(
          (it) => it.sku.toLowerCase() === skuInput.toLowerCase(),

          toast(

          sku: item.sku,

      function recalcReceiveTotals(poId) {
        const po = state.pos[state.outlet].find((p) => p.id === poId);
        if (!po) return;
        let recv = 0,
          cost = 0;
        po.lines.forEach((l, idx) => {
          const inp = document.getElementById("recv_" + idx);
          const q = inp ? parseFloat(inp.value) || 0 : l.qty;
          recv += q;
          cost += round2((l.unitCost || 0) * q);

        const recvEl = document.getElementById("poFootRecv");
        if (recvEl) recvEl.textContent = fmtNum(recv);
        const costEl = document.getElementById("poFootCost");

      async function receivePO(id) {
        const po = state.pos[state.outlet].find((p) => p.id === id);
        const items = state.stock[state.outlet];
        po.lines.forEach((l, idx) => {
          const recvInput = document.getElementById("recv_" + idx);
          const recvQty = recvInput ? parseFloat(recvInput.value) : l.qty;
          l.qtyReceived = isNaN(recvQty) ? l.qty : recvQty;
          let it = items.find(
            (x) => x.sku.toLowerCase() === l.sku.toLowerCase(),
          );
          if (!it) {
            it = {
              id: uid("it"),
              sku: l.sku,
              cat: "Uncategorised",
              subcat: "",
              name: l.name,
              unit: "-",
              price: l.unitCost || 0,
              opening: 0,
              qtyIn: 0,
              qtyOut: 0,
              physical: 0,
              physicalDate: todayStr(),
              expiryDate: "",
              barcode: "",
              lastSupplier: po.supplier || "",
            };
            items.push(it);
          }
          it.qtyIn = round2((it.qtyIn || 0) + l.qtyReceived);
          if (l.unitCost) it.price = l.unitCost;
          if (po.supplier) it.lastSupplier = po.supplier;
        });
        await saveStock(state.outlet);
        for (const l of po.lines) {
          const value = l.unitCost ? round2(l.unitCost * l.qtyReceived) : null;
          await logMovement(state.outlet, {
            type: "purchase-received",
            sku: l.sku,
            name: l.name,
            qty: l.qtyReceived,
            value,
            supplier: po.supplier,
            ref: po.poNumber,
            note: `Received against ${po.poNumber}`,
          });
        }
        po.status = "completed";
        po.receivedBy = state.user.username;
        po.receivedAt = todayStr();
        await storeSet("os_po:" + state.outlet, state.pos[state.outlet]);
        closeModal();
        toast(
          `${po.poNumber} received — converted to Stock In and marked completed.`,
        );
        renderApp();
      }

          toast(

            true,

          return;

        toast("Generating image…");
        html2canvas(content, { backgroundColor: "#ffffff", scale: 2 })
          .then((canvas) => {
            canvas.toBlob((blob) => {
              if (!blob) {
                toast(
                  "Image generation failed — try Export PDF instead.",
                  true,
                );
                return;
              }
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = "purchase_order.png";
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 2000);
              toast("Image downloaded — attach it to Telegram or email.");

      function openScanModal(targetInputId, onFillCallback) {
        showModal(`<h3>Scan Barcode</h3>
    <video id="scanVideo" style="width:100%;border-radius:6px;background:#000;" autoplay playsinline muted></video>
    <div id="scanStatus" class="hint" style="margin-top:8px;">Point the camera at a barcode.</div>
    <div class="modal-actions"><button class="btn btn-ghost btn-sm" onclick="stopScan()">Cancel</button></div>`);

      async function startScan(targetInputId, onFillCallback) {
        const statusEl = document.getElementById("scanStatus");
        if (!("BarcodeDetector" in window)) {
          statusEl.innerHTML =
            "Barcode scanning isn't supported in this browser. Try Chrome on Android or desktop, or type the code into the field instead.";
          return;
        }
        try {
          scanState.stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
          });
          const video = document.getElementById("scanVideo");
          if (!video) {
            stopScan();
            return;
          }
          video.srcObject = scanState.stream;
          const detector = new BarcodeDetector();
          scanState.interval = setInterval(async () => {
            try {
              const codes = await detector.detect(video);
              if (codes.length > 0) {
                const val = codes[0].rawValue;
                const targetEl = document.getElementById(targetInputId);
                if (targetEl) {
                  targetEl.value = val;
                  targetEl.dispatchEvent(
                    new Event("change", { bubbles: true }),
                  );
                }
                stopScan();
                toast("Scanned: " + val);
                if (
                  onFillCallback &&
                  typeof window[onFillCallback] === "function"
                )
                  window[onFillCallback]();
              }
            } catch (e) {}
          }, 400);
        } catch (e) {
          if (statusEl)
            statusEl.textContent =
              "Could not access camera — check browser permissions.";
        }
      }
      function stopScan() {
        if (scanState.interval) clearInterval(scanState.interval);
        if (scanState.stream)
          scanState.stream.getTracks().forEach((t) => t.stop());
        scanState.stream = null;
        scanState.interval = null;
        closeModal();
      }

      function handleCategoryImport(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function (ev) {
          try {
            const wb = XLSX.read(ev.target.result, { type: "binary" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const matrix = XLSX.utils
              .sheet_to_json(ws, { header: 1, defval: "" })
              .filter((r) => r.length > 0);
            const headerIdx = detectHeader(matrix[0], {
              cat: /category/,
              sub: /sub/,
            });
            const dataRows =
              headerIdx.cat !== undefined ? matrix.slice(1) : matrix;
            let added = 0,
              subsAdded = 0;
            dataRows.forEach((r) => {
              const catName = String(
                r[headerIdx.cat !== undefined ? headerIdx.cat : 0] || "",
              ).trim();
              const subName = String(
                r[headerIdx.sub !== undefined ? headerIdx.sub : 1] || "",
              ).trim();
              if (!catName) return;
              let cat = state.categories.find(
                (c) => c.name.toLowerCase() === catName.toLowerCase(),
              );
              if (!cat) {
                cat = { id: uid("cat"), name: catName, subcats: [] };
                state.categories.push(cat);
                added++;
              }
              if (subName && !cat.subcats.includes(subName)) {
                cat.subcats.push(subName);
                subsAdded++;
              }
            });
            await storeSet("os_categories", state.categories);
            toast(
              `Imported ${added} new categor${added === 1 ? "y" : "ies"}, ${subsAdded} sub-categor${subsAdded === 1 ? "y" : "ies"}.`,
            );
            renderApp();
          } catch (err) {
            toast("Could not read file — check it's a valid Excel/CSV.", true);
          }
        };
        reader.readAsBinaryString(file);
      }
